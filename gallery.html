<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>갤러리 — 北CINEMA</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --ink:   #1a1209;
      --paper: #faf7f2;
      --gold:  #c9a84c;
      --gold2: #e8c96a;
      --gray:  #6b6355;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--ink);
      color: var(--paper);
      font-family: 'Georgia', serif;
      min-height: 100vh;
    }

    /* ── 네비 ── */
    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.2rem 3rem;
      border-bottom: 1px solid rgba(201,168,76,0.2);
      position: sticky;
      top: 0;
      background: rgba(26,18,9,0.95);
      backdrop-filter: blur(10px);
      z-index: 100;
    }
    .logo {
      font-size: 1.4rem;
      font-weight: bold;
      color: var(--gold);
      text-decoration: none;
      letter-spacing: 0.1em;
    }
    .nav-links { display: flex; gap: 2rem; list-style: none; }
    .nav-links a {
      color: var(--paper);
      text-decoration: none;
      font-size: 0.9rem;
      opacity: 0.8;
      transition: opacity 0.2s;
    }
    .nav-links a:hover,
    .nav-links a.active { opacity: 1; color: var(--gold); }

    /* ── 헤더 ── */
    .page-header {
      text-align: center;
      padding: 4rem 2rem 2rem;
    }
    .page-header h1 {
      font-size: 2.4rem;
      color: var(--gold);
      letter-spacing: 0.15em;
      margin-bottom: 0.5rem;
    }
    .page-header p {
      color: var(--gray);
      font-size: 1rem;
    }

    /* ── 업로드 버튼 ── */
    .upload-toggle {
      display: flex;
      justify-content: center;
      margin: 1.5rem 0;
    }
    .btn-upload-open {
      background: var(--gold);
      color: var(--ink);
      border: none;
      padding: 0.8rem 2.5rem;
      font-size: 1rem;
      font-family: 'Georgia', serif;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
      letter-spacing: 0.05em;
      transition: background 0.2s, transform 0.1s;
    }
    .btn-upload-open:hover {
      background: var(--gold2);
      transform: translateY(-1px);
    }

    /* ── 업로드 패널 ── */
    .upload-panel {
      display: none;
      max-width: 640px;
      margin: 0 auto 2.5rem;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(201,168,76,0.25);
      border-radius: 12px;
      padding: 2rem;
    }
    .upload-panel.open { display: block; }

    .upload-panel h2 {
      color: var(--gold);
      font-size: 1.2rem;
      margin-bottom: 1.5rem;
      text-align: center;
      letter-spacing: 0.08em;
    }

    /* 드래그 앤 드롭 존 */
    .drop-zone {
      border: 2px dashed rgba(201,168,76,0.4);
      border-radius: 10px;
      padding: 2.5rem;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      position: relative;
      margin-bottom: 1.5rem;
    }
    .drop-zone:hover,
    .drop-zone.dragover {
      border-color: var(--gold);
      background: rgba(201,168,76,0.06);
    }
    .drop-zone input[type="file"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
      width: 100%;
      height: 100%;
    }
    .drop-icon { font-size: 2.8rem; margin-bottom: 0.8rem; }
    .drop-zone p { color: var(--gray); font-size: 0.95rem; line-height: 1.6; }
    .drop-zone .file-name {
      margin-top: 0.8rem;
      color: var(--gold);
      font-size: 0.9rem;
      font-weight: bold;
    }

    /* 미리보기 */
    .preview-wrap {
      display: none;
      margin-bottom: 1.5rem;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid rgba(201,168,76,0.2);
    }
    .preview-wrap video {
      width: 100%;
      max-height: 240px;
      object-fit: cover;
      display: block;
    }

    /* 폼 필드 */
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      margin-bottom: 1rem;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }
    .form-group.full { grid-column: 1 / -1; }
    .form-group label {
      font-size: 0.8rem;
      color: var(--gold);
      letter-spacing: 0.05em;
    }
    .form-group input,
    .form-group textarea,
    .form-group select {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(201,168,76,0.2);
      border-radius: 6px;
      color: var(--paper);
      padding: 0.6rem 0.8rem;
      font-family: 'Georgia', serif;
      font-size: 0.9rem;
      resize: none;
      transition: border-color 0.2s;
    }
    .form-group input:focus,
    .form-group textarea:focus,
    .form-group select:focus {
      outline: none;
      border-color: var(--gold);
    }
    .form-group select option { background: var(--ink); }

    /* 진행 바 */
    .progress-wrap {
      display: none;
      margin-bottom: 1rem;
    }
    .progress-label {
      font-size: 0.8rem;
      color: var(--gray);
      margin-bottom: 0.4rem;
    }
    .progress-bar-bg {
      background: rgba(255,255,255,0.08);
      border-radius: 99px;
      height: 8px;
      overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--gold), var(--gold2));
      border-radius: 99px;
      transition: width 0.3s;
    }

    .btn-submit {
      width: 100%;
      background: var(--gold);
      color: var(--ink);
      border: none;
      padding: 0.9rem;
      font-size: 1rem;
      font-family: 'Georgia', serif;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      letter-spacing: 0.05em;
      transition: background 0.2s;
    }
    .btn-submit:hover { background: var(--gold2); }
    .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }

    /* 상태 메시지 */
    .status-msg {
      text-align: center;
      font-size: 0.9rem;
      margin-top: 1rem;
      min-height: 1.2em;
    }
    .status-msg.ok  { color: #6fcf97; }
    .status-msg.err { color: #eb5757; }

    /* ── 갤러리 그리드 ── */
    .gallery-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 2rem 4rem;
    }

    .gallery-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
      gap: 1rem;
    }
    .gallery-count { color: var(--gray); font-size: 0.9rem; }

    .filter-tabs { display: flex; gap: 0.5rem; flex-wrap: wrap; }
    .filter-tab {
      background: transparent;
      border: 1px solid rgba(201,168,76,0.3);
      color: var(--paper);
      padding: 0.4rem 1rem;
      border-radius: 99px;
      font-size: 0.82rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .filter-tab:hover,
    .filter-tab.active {
      background: var(--gold);
      color: var(--ink);
      border-color: var(--gold);
      font-weight: bold;
    }

    .video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.5rem;
    }

    .video-card {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(201,168,76,0.15);
      border-radius: 10px;
      overflow: hidden;
      transition: transform 0.2s, border-color 0.2s;
      cursor: pointer;
    }
    .video-card:hover {
      transform: translateY(-4px);
      border-color: rgba(201,168,76,0.5);
    }

    .card-thumb {
      position: relative;
      width: 100%;
      padding-top: 56.25%;
      background: #111;
      overflow: hidden;
    }
    .card-thumb img,
    .card-thumb video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .play-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.3);
      opacity: 0;
      transition: opacity 0.2s;
    }
    .video-card:hover .play-overlay { opacity: 1; }
    .play-icon {
      width: 52px; height: 52px;
      background: rgba(201,168,76,0.9);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.4rem;
    }

    .card-body { padding: 1rem 1.1rem 1.1rem; }
    .card-genre {
      font-size: 0.72rem;
      color: var(--gold);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 0.4rem;
    }
    .card-title {
      font-size: 1rem;
      font-weight: bold;
      margin-bottom: 0.3rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .card-book {
      font-size: 0.82rem;
      color: var(--gray);
      margin-bottom: 0.8rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .like-btn {
      background: none;
      border: 1px solid rgba(201,168,76,0.3);
      color: var(--paper);
      padding: 0.3rem 0.8rem;
      border-radius: 99px;
      font-size: 0.82rem;
      cursor: pointer;
      transition: all 0.2s;
      display: flex; align-items: center; gap: 0.3rem;
    }
    .like-btn:hover,
    .like-btn.liked {
      background: rgba(201,168,76,0.15);
      border-color: var(--gold);
      color: var(--gold);
    }
    .card-author { font-size: 0.78rem; color: var(--gray); }

    /* 빈 상태 */
    .empty-state {
      text-align: center;
      padding: 5rem 2rem;
      color: var(--gray);
    }
    .empty-state .empty-icon { font-size: 3rem; margin-bottom: 1rem; }
    .empty-state p { font-size: 1rem; line-height: 1.8; }

    /* 로딩 */
    .loading {
      text-align: center;
      padding: 4rem;
      color: var(--gray);
      font-size: 1rem;
    }

    /* ── 모달 ── */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      z-index: 200;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .modal-overlay.open { display: flex; }
    .modal-box {
      background: #1e1710;
      border: 1px solid rgba(201,168,76,0.3);
      border-radius: 12px;
      max-width: 780px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
    }
    .modal-video-wrap {
      position: relative;
      width: 100%;
      padding-top: 56.25%;
      background: #000;
    }
    .modal-video-wrap iframe,
    .modal-video-wrap video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    .modal-body { padding: 1.5rem; }
    .modal-title { font-size: 1.3rem; color: var(--gold); margin-bottom: 0.5rem; }
    .modal-meta { font-size: 0.85rem; color: var(--gray); margin-bottom: 1rem; line-height: 1.8; }
    .modal-desc { font-size: 0.95rem; line-height: 1.7; color: var(--paper); margin-bottom: 1.2rem; }
    .modal-actions { display: flex; gap: 0.8rem; }
    .modal-close {
      background: rgba(255,255,255,0.08);
      border: none; color: var(--paper);
      padding: 0.6rem 1.4rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
    }
    .modal-delete {
      background: rgba(235,87,87,0.15);
      border: 1px solid rgba(235,87,87,0.4);
      color: #eb5757;
      padding: 0.6rem 1.4rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
    }

    @media (max-width: 600px) {
      nav { padding: 1rem 1.2rem; }
      .page-header h1 { font-size: 1.6rem; }
      .form-grid { grid-template-columns: 1fr; }
      .video-grid { grid-template-columns: 1fr; }
      .gallery-container { padding: 0 1rem 3rem; }
    }
  </style>
</head>
<body>

<!-- 네비 -->
<nav>
  <a class="logo" href="../index.html">北CINEMA</a>
  <ul class="nav-links">
    <li><a href="../index.html">홈</a></li>
    <li><a href="../guide/step1.html">가이드</a></li>
    <li><a href="gallery.html" class="active">갤러리</a></li>
    <li><a href="../community.html">커뮤니티</a></li>
  </ul>
</nav>

<!-- 헤더 -->
<div class="page-header">
  <h1>📽 GALLERY</h1>
  <p>책에서 태어난 영상들을 감상하세요</p>
</div>

<!-- 업로드 버튼 -->
<div class="upload-toggle">
  <button class="btn-upload-open" onclick="togglePanel()">＋ 영상 업로드</button>
</div>

<!-- 업로드 패널 -->
<div class="upload-panel" id="uploadPanel">
  <h2>✦ 새 영상 등록</h2>

  <!-- 드래그 앤 드롭 존 -->
  <div class="drop-zone" id="dropZone">
    <input type="file" id="fileInput" accept="video/*" />
    <div class="drop-icon">🎬</div>
    <p>영상 파일을 여기에 드래그하거나<br/>클릭해서 선택하세요</p>
    <p style="font-size:0.78rem; margin-top:0.5rem; color:#555">MP4, MOV, WebM 지원 · 최대 500MB</p>
    <div class="file-name" id="fileName"></div>
  </div>

  <!-- 미리보기 -->
  <div class="preview-wrap" id="previewWrap">
    <video id="previewVideo" controls muted></video>
  </div>

  <!-- 폼 -->
  <div class="form-grid">
    <div class="form-group">
      <label>영상 제목 *</label>
      <input type="text" id="fTitle" placeholder="나의 작품 제목" />
    </div>
    <div class="form-group">
      <label>작성자</label>
      <input type="text" id="fAuthor" placeholder="익명" />
    </div>
    <div class="form-group">
      <label>원작 책 제목</label>
      <input type="text" id="fBook" placeholder="예: 데미안" />
    </div>
    <div class="form-group">
      <label>원작 저자</label>
      <input type="text" id="fBookAuthor" placeholder="예: 헤르만 헤세" />
    </div>
    <div class="form-group">
      <label>장르</label>
      <select id="fGenre">
        <option value="">선택</option>
        <option value="소설">소설</option>
        <option value="시">시</option>
        <option value="수필">수필</option>
        <option value="고전">고전</option>
        <option value="기타">기타</option>
      </select>
    </div>
    <div class="form-group full">
      <label>설명</label>
      <textarea id="fDesc" rows="3" placeholder="이 영상에 대한 짧은 소개를 적어주세요"></textarea>
    </div>
  </div>

  <!-- 진행 바 -->
  <div class="progress-wrap" id="progressWrap">
    <div class="progress-label" id="progressLabel">업로드 중... 0%</div>
    <div class="progress-bar-bg">
      <div class="progress-bar-fill" id="progressFill"></div>
    </div>
  </div>

  <button class="btn-submit" id="btnSubmit" onclick="uploadVideo()">🎬 업로드</button>
  <div class="status-msg" id="statusMsg"></div>
</div>

<!-- 갤러리 -->
<div class="gallery-container">
  <div class="gallery-toolbar">
    <span class="gallery-count" id="galleryCount">불러오는 중...</span>
    <div class="filter-tabs" id="filterTabs">
      <button class="filter-tab active" data-genre="전체" onclick="filterVideos(this)">전체</button>
      <button class="filter-tab" data-genre="소설" onclick="filterVideos(this)">소설</button>
      <button class="filter-tab" data-genre="시" onclick="filterVideos(this)">시</button>
      <button class="filter-tab" data-genre="수필" onclick="filterVideos(this)">수필</button>
      <button class="filter-tab" data-genre="고전" onclick="filterVideos(this)">고전</button>
      <button class="filter-tab" data-genre="기타" onclick="filterVideos(this)">기타</button>
    </div>
  </div>
  <div class="video-grid" id="videoGrid">
    <div class="loading">영상을 불러오는 중...</div>
  </div>
</div>

<!-- 모달 -->
<div class="modal-overlay" id="modal">
  <div class="modal-box">
    <div class="modal-video-wrap" id="modalVideoWrap"></div>
    <div class="modal-body">
      <div class="modal-title" id="modalTitle"></div>
      <div class="modal-meta"  id="modalMeta"></div>
      <div class="modal-desc"  id="modalDesc"></div>
      <div class="modal-actions">
        <button class="modal-close"   onclick="closeModal()">✕ 닫기</button>
        <button class="modal-delete"  id="modalDeleteBtn" onclick="deleteVideo()">🗑 삭제</button>
      </div>
    </div>
  </div>
</div>

<script>
  // ── Supabase 초기화 ──────────────────────────────────────
  const { createClient } = supabase;
  const sb = createClient(
    'https://akxrzbnttqkosxkpjgoo.supabase.co/rest/v1',      
    'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFreHJ6Ym50dHFrb3N4a3BqZ29vIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE5ODA4MzYsImV4cCI6MjA5NzU1NjgzNn0.BJmHmo_NkbtMqwj8cXBN0N2p8MMDXWCbyy4Qs_rWQDE'  
  );

  const BUCKET = 'videos';

  // 세션 ID (좋아요 중복 방지)
  let sid = localStorage.getItem('bc_sid');
  if (!sid) { sid = crypto.randomUUID(); localStorage.setItem('bc_sid', sid); }

  // 전체 데이터 캐시
  let allVideos = [];
  let currentFilter = '전체';
  let selectedFile = null;
  let currentVideoId = null;

  // ── 업로드 패널 토글 ────────────────────────────────────
  function togglePanel() {
    const p = document.getElementById('uploadPanel');
    p.classList.toggle('open');
    p.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  // ── 드래그 앤 드롭 ──────────────────────────────────────
  const dropZone  = document.getElementById('dropZone');
  const fileInput = document.getElementById('fileInput');

  dropZone.addEventListener('dragover', e => {
    e.preventDefault();
    dropZone.classList.add('dragover');
  });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
  dropZone.addEventListener('drop', e => {
    e.preventDefault();
    dropZone.classList.remove('dragover');
    const file = e.dataTransfer.files[0];
    if (file && file.type.startsWith('video/')) setFile(file);
    else showStatus('❌ 영상 파일만 업로드 가능합니다.', 'err');
  });

  fileInput.addEventListener('change', () => {
    if (fileInput.files[0]) setFile(fileInput.files[0]);
  });

  function setFile(file) {
    selectedFile = file;
    document.getElementById('fileName').textContent = `✔ ${file.name}`;

    // 미리보기
    const url = URL.createObjectURL(file);
    const vid = document.getElementById('previewVideo');
    vid.src = url;
    document.getElementById('previewWrap').style.display = 'block';
  }

  // ── 업로드 실행 ─────────────────────────────────────────
  async function uploadVideo() {
    const title = document.getElementById('fTitle').value.trim();
    if (!title) { showStatus('❌ 영상 제목을 입력해주세요.', 'err'); return; }
    if (!selectedFile) { showStatus('❌ 영상 파일을 선택해주세요.', 'err'); return; }

    const btn = document.getElementById('btnSubmit');
    btn.disabled = true;
    showStatus('', '');

    // 진행 바 표시
    const pw = document.getElementById('progressWrap');
    const pf = document.getElementById('progressFill');
    const pl = document.getElementById('progressLabel');
    pw.style.display = 'block';

    try {
      // 1. Storage 업로드
      const ext      = selectedFile.name.split('.').pop();
      const filePath = `${Date.now()}_${Math.random().toString(36).slice(2)}.${ext}`;

      // 가짜 진행 애니메이션 (Supabase SDK는 progress 콜백 미지원)
      let fakeProgress = 0;
      const timer = setInterval(() => {
        fakeProgress = Math.min(fakeProgress + Math.random() * 8, 85);
        pf.style.width = fakeProgress + '%';
        pl.textContent = `업로드 중... ${Math.round(fakeProgress)}%`;
      }, 300);

      const { data: storageData, error: storageErr } = await sb.storage
        .from(BUCKET)
        .upload(filePath, selectedFile, { cacheControl: '3600', upsert: false });

      clearInterval(timer);

      if (storageErr) throw storageErr;

      pf.style.width = '100%';
      pl.textContent = '업로드 완료! DB에 저장 중...';

      // 2. 공개 URL 획득
      const { data: urlData } = sb.storage.from(BUCKET).getPublicUrl(filePath);
      const publicUrl = urlData.publicUrl;

      // 3. DB 저장
      const { error: dbErr } = await sb.from('videos').insert({
        title,
        author:      document.getElementById('fAuthor').value.trim()     || '익명',
        description: document.getElementById('fDesc').value.trim()       || null,
        genre:       document.getElementById('fGenre').value             || null,
        book_title:  document.getElementById('fBook').value.trim()       || null,
        book_author: document.getElementById('fBookAuthor').value.trim() || null,
        video_url:   publicUrl,
        youtube_id:  null,
        likes:       0
      });

      if (dbErr) throw dbErr;

      pf.style.width = '100%';
      pl.textContent = '✅ 완료!';
      showStatus('🎉 영상이 성공적으로 등록되었습니다!', 'ok');

      // 폼 초기화
      setTimeout(() => {
        resetForm();
        loadVideos();
        togglePanel();
      }, 1500);

    } catch (err) {
      console.error(err);
      showStatus('❌ 업로드 실패: ' + (err.message || err), 'err');
      document.getElementById('progressWrap').style.display = 'none';
    } finally {
      btn.disabled = false;
    }
  }

  function resetForm() {
    selectedFile = null;
    document.getElementById('fileInput').value = '';
    document.getElementById('fileName').textContent = '';
    document.getElementById('previewWrap').style.display = 'none';
    document.getElementById('previewVideo').src = '';
    document.getElementById('fTitle').value = '';
    document.getElementById('fAuthor').value = '';
    document.getElementById('fBook').value = '';
    document.getElementById('fBookAuthor').value = '';
    document.getElementById('fGenre').value = '';
    document.getElementById('fDesc').value = '';
    document.getElementById('progressWrap').style.display = 'none';
    document.getElementById('progressFill').style.width = '0%';
    document.getElementById('statusMsg').textContent = '';
  }

  function showStatus(msg, type) {
    const el = document.getElementById('statusMsg');
    el.textContent = msg;
    el.className = 'status-msg ' + type;
  }

  // ── 갤러리 로드 ─────────────────────────────────────────
  async function loadVideos() {
    const grid = document.getElementById('videoGrid');
    grid.innerHTML = '<div class="loading">영상을 불러오는 중...</div>';

    const { data, error } = await sb
      .from('videos')
      .select('*')
      .order('created_at', { ascending: false });

    if (error) {
      grid.innerHTML = `<div class="empty-state"><p>❌ 불러오기 실패: ${error.message}</p></div>`;
      return;
    }

    allVideos = data || [];
    renderVideos();
  }

  function renderVideos() {
    const grid  = document.getElementById('videoGrid');
    const count = document.getElementById('galleryCount');
    const likedSet = getLikedSet();

    const filtered = currentFilter === '전체'
      ? allVideos
      : allVideos.filter(v => v.genre === currentFilter);

    count.textContent = `총 ${filtered.length}개 작품`;

    if (filtered.length === 0) {
      grid.innerHTML = `
        <div class="empty-state" style="grid-column:1/-1">
          <div class="empty-icon">🎬</div>
          <p>아직 등록된 영상이 없습니다.<br/>첫 번째 영상을 업로드해보세요!</p>
        </div>`;
      return;
    }

    grid.innerHTML = filtered.map(v => {
      const thumb = v.youtube_id
        ? `https://img.youtube.com/vi/${v.youtube_id}/mqdefault.jpg`
        : (v.thumbnail || '');
      const liked = likedSet.has(String(v.id));

      return `
        <div class="video-card" onclick="openModal(${v.id})">
          <div class="card-thumb">
            ${thumb
              ? `![${v.title}](${thumb})`
              : `<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:2rem">🎬</div>`
            }
            <div class="play-overlay"><div class="play-icon">▶</div></div>
          </div>
          <div class="card-body">
            <div class="card-genre">${v.genre || '영상'}</div>
            <div class="card-title">${v.title}</div>
            <div class="card-book">${v.book_title ? `📖 ${v.book_title}${v.book_author ? ' — ' + v.book_author : ''}` : ''}</div>
            <div class="card-footer">
              <button class="like-btn ${liked ? 'liked' : ''}"
                onclick="event.stopPropagation(); toggleLike(${v.id}, this)">
                ${liked ? '❤️' : '🤍'} ${v.likes || 0}
              </button>
              <span class="card-author">${v.author || '익명'}</span>
            </div>
          </div>
        </div>`;
    }).join('');
  }

  // ── 필터 ────────────────────────────────────────────────
  function filterVideos(btn) {
    document.querySelectorAll('.filter-tab').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = btn.dataset.genre;
    renderVideos();
  }

  // ── 좋아요 ──────────────────────────────────────────────
  function getLikedSet() {
    return new Set(JSON.parse(localStorage.getItem('bc_liked') || '[]'));
  }
  function saveLikedSet(s) {
    localStorage.setItem('bc_liked', JSON.stringify([...s]));
  }

  async function toggleLike(id, btn) {
    const likedSet = getLikedSet();
    const key = String(id);
    const video = allVideos.find(v => v.id === id);
    if (!video) return;

    const isLiked = likedSet.has(key);
    const newLikes = Math.max(0, (video.likes || 0) + (isLiked ? -1 : 1));

    const { error } = await sb.from('videos').update({ likes: newLikes }).eq('id', id);
    if (error) return;

    video.likes = newLikes;
    if (isLiked) likedSet.delete(key); else likedSet.add(key);
    saveLikedSet(likedSet);

    btn.innerHTML = `${likedSet.has(key) ? '❤️' : '🤍'} ${newLikes}`;
    btn.classList.toggle('liked', likedSet.has(key));
  }

  // ── 모달 ────────────────────────────────────────────────
  function openModal(id) {
    const v = allVideos.find(v => v.id === id);
    if (!v) return;
    currentVideoId = id;

    const wrap = document.getElementById('modalVideoWrap');
    wrap.innerHTML = v.youtube_id
      ? `<iframe src="https://www.youtube.com/embed/${v.youtube_id}?autoplay=1"
           frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>`
      : v.video_url
        ? `<video src="${v.video_url}" controls autoplay style="background:#000"></video>`
        : `<div style="display:flex;align-items:center;justify-content:center;height:200px;color:#666">영상 없음</div>`;

    document.getElementById('modalTitle').textContent = v.title;
    document.getElementById('modalMeta').innerHTML =
      `👤 ${v.author || '익명'} &nbsp;·&nbsp; ${v.genre || ''} &nbsp;·&nbsp; 📖 ${v.book_title || '-'}`;
    document.getElementById('modalDesc').textContent = v.description || '';

    document.getElementById('modal').classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function closeModal() {
    document.getElementById('modal').classList.remove('open');
    document.getElementById('modalVideoWrap').innerHTML = '';
    document.body.style.overflow = '';
    currentVideoId = null;
  }

  async function deleteVideo() {
    if (!currentVideoId) return;
    if (!confirm('정말 삭제하시겠습니까?')) return;

    const video = allVideos.find(v => v.id === currentVideoId);

    // Storage 파일 삭제
    if (video?.video_url) {
      const path = video.video_url.split(`/${BUCKET}/`)[1];
      if (path) await sb.storage.from(BUCKET).remove([path]);
    }

    const { error } = await sb.from('videos').delete().eq('id', currentVideoId);
    if (error) { alert('삭제 실패: ' + error.message); return; }

    closeModal();
    loadVideos();
  }

  // ESC 키로 모달 닫기
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

  // ── 초기 로드 ───────────────────────────────────────────
  loadVideos();
</script>
</body>
</html>
